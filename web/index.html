<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="google-client-id" content="__GOOGLE_CLIENT_ID__">
  <title>潮汐小岛</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body { background: #075c78; font-family: system-ui, sans-serif; }
    #game { display: block; }
    #google-auth-root { position: fixed; z-index: 20; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); pointer-events: auto; }
    #google-account-button { min-height: 44px; max-width: min(260px, calc(100vw - 28px)); display: flex; align-items: center; gap: 9px; padding: 6px 13px; border: 1px solid rgba(241,221,145,.72); border-radius: 14px; background: rgba(2,39,51,.9); color: #fff8d7; font: 700 14px/1 system-ui,sans-serif; box-shadow: 0 6px 22px rgba(0,0,0,.3); cursor: pointer; backdrop-filter: blur(8px); touch-action: manipulation; }
    #google-account-button img, .google-avatar-fallback { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; object-fit: cover; background: #fff; color: #4285f4; font-weight: 900; }
    .google-g { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #4285f4; font: 900 16px/1 Arial,sans-serif; }
    #google-auth-dialog { width: min(520px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); overflow-y: auto; border: 1px solid rgba(241,221,145,.72); border-radius: 20px; padding: 0; color: #eefbf3; background: rgba(2,39,51,.98); box-shadow: 0 22px 70px rgba(0,0,0,.55); touch-action: pan-y; }
    #google-auth-dialog::backdrop { background: rgba(0,26,37,.62); backdrop-filter: blur(4px); }
    .google-auth-card { padding: 24px; }
    .google-auth-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .google-auth-head h2 { margin: 0; color: #fff4c7; font-size: 22px; }
    #google-auth-close { width: 38px; height: 38px; border: 0; border-radius: 11px; background: #a97931; color: white; font-size: 22px; cursor: pointer; }
    .google-auth-subtitle, #google-auth-status { color: #bbd8d3; font-size: 13px; line-height: 1.55; }
    #google-signin-button { min-height: 44px; margin: 20px 0 14px; display: flex; justify-content: center; }
    #google-auth-status[data-tone="error"] { color: #ffb5aa; }
    #google-auth-status[data-tone="success"] { color: #8ce3bd; }
    #google-profile { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 12px; align-items: center; margin: 18px 0; padding: 14px; border-radius: 14px; background: rgba(31,108,99,.45); }
    #google-profile [data-profile-avatar] img, #google-profile .google-avatar-fallback { width: 48px; height: 48px; }
    .google-profile-copy { min-width: 0; }
    .google-profile-copy strong, .google-profile-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .google-profile-copy span { margin-top: 5px; color: #bcd7d3; font-size: 12px; }
    #google-logout { width: 100%; min-height: 44px; border: 1px solid #5ea99d; border-radius: 12px; color: #eafff9; background: #236b65; font-weight: 700; cursor: pointer; }
    .google-auth-legal { display: flex; justify-content: center; gap: 14px; margin-top: 14px; font-size: 12px; }
    .google-auth-legal a { color: #9fd8cf; }
    [hidden] { display: none !important; }
    #cloud-save-panel { margin: 16px 0; border-top: 1px solid #438b82; padding-top: 14px; }
    #cloud-save-panel h3 { margin: 0 0 10px; color: #fff4c7; font-size: 17px; }
    .cloud-summary { margin: 9px 0; padding: 10px; background: #164d50; border-radius: 10px; font-size: 13px; line-height: 1.7; }
    .cloud-summary strong, .cloud-summary span { display: block; }
    .cloud-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #cloud-save-panel button { min-height: 42px; padding: 9px 12px; border: 1px solid #6cab91; border-radius: 10px; background: #276c61; color: #fff9dc; cursor: pointer; font: 600 13px/1.5 system-ui,sans-serif; }
    #cloud-save-panel button:disabled { opacity: .45; cursor: default; }
    #cloud-save-status { font-size: 12px; color: #bbd8d3; line-height: 1.6; }
    #cloud-save-choice { margin-top: 14px; padding: 14px; border: 1px solid #e4bf69; border-radius: 12px; }
    #cloud-save-history { display: grid; gap: 8px; margin-top: 12px; max-height: 230px; overflow-y: auto; }
    #cloud-save-history button { text-align: left; font-weight: 400; }
    @media (max-width: 640px) { #google-auth-root { top: 9px; right: 9px; } #google-account-button { min-height: 40px; padding: 5px 10px; } #google-account-button img, .google-avatar-fallback { width: 28px; height: 28px; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="google-auth-root" data-signed-in="false">
    <button id="google-account-button" type="button" aria-haspopup="dialog"><span class="google-g">G</span><span>Google 登录</span></button>
    <dialog id="google-auth-dialog" aria-labelledby="google-auth-title">
      <div class="google-auth-card">
        <div class="google-auth-head"><h2 id="google-auth-title">岛民账号</h2><button id="google-auth-close" type="button" aria-label="关闭">×</button></div>
        <p class="google-auth-subtitle">使用 Google 账号管理云存档。上传、下载和恢复前由你选择，进度不会自动覆盖。</p>
        <div id="google-signin-button"></div>
        <div id="google-profile" hidden>
          <div data-profile-avatar></div>
          <div class="google-profile-copy"><strong data-profile-name></strong><span data-profile-email></span></div>
        </div>
        <p id="google-auth-status" role="status">正在准备 Google 登录…</p>
        <section id="cloud-save-panel" aria-label="游戏存档" hidden>
          <h3>游戏存档</h3>
          <div class="cloud-summary"><strong>当前设备进度</strong><span id="cloud-local-summary"></span></div>
          <div class="cloud-summary"><strong>账号云端进度</strong><span id="cloud-remote-summary"></span></div>
          <div class="cloud-actions">
            <button id="cloud-save-upload" type="button">上传当前进度</button>
            <button id="cloud-save-download" type="button">下载云端进度</button>
            <button id="cloud-save-versions" type="button">历史恢复</button>
            <button id="cloud-switch-local" type="button" hidden>切换此账号本地进度</button>
          </div>
          <p id="cloud-save-status"></p>
          <section id="cloud-save-choice" aria-labelledby="cloud-choice-title" hidden>
            <h3 id="cloud-choice-title">选择保留哪份进度</h3>
            <div class="cloud-summary"><strong>当前设备</strong><span id="cloud-choice-local"></span></div>
            <div class="cloud-summary"><strong>选中的云端版本</strong><span id="cloud-choice-remote"></span></div>
            <p class="google-auth-subtitle">替换前会保留当前设备备份；上传不会把金币和材料相加。载入后从存档时间继续游玩。</p>
            <div class="cloud-actions"><button id="cloud-keep-local" type="button">保留本地</button><button id="cloud-use-remote" type="button">使用云端并重新载入</button></div>
          </section>
          <div id="cloud-save-history" aria-label="最近存档版本" hidden></div>
        </section>
        <button id="google-logout" type="button" hidden>退出登录</button>
        <nav class="google-auth-legal" aria-label="账号政策"><a href="privacy.html" target="_blank" rel="noopener">隐私政策</a><a href="terms.html" target="_blank" rel="noopener">服务条款</a></nav>
      </div>
    </dialog>
  </div>
  <script src="main.js"></script>
</body>
</html>
